<section class="login-page">
  <div class="login-card animate__animated animate__fadeInUp">
    <span class="eyebrow">Bienvenido</span>
    <h2 class="login-title">Inicia sesión</h2>
    <p class="login-sub">Accede para comparar modelos de IA en segundos.</p>

    <p class="alert-success-message" *ngIf="success">{{ success }}</p>

    <form (ngSubmit)="submit()">
      <div class="mb-3">
        <label for="email" class="form-label">Nombre de usuario</label>
        <input
          id="email"
          type="text"
          name="username"
          [(ngModel)]="username"
          class="form-control form-control-lg"
          placeholder="Tu nombre de usuario"
        />
      </div>

      <div class="mb-2">
        <label for="password" class="form-label">Contraseña</label>
        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          class="form-control form-control-lg"
          placeholder="Tu contraseña"
        />
      </div>

      <div class="forgot-link mb-4">
        <a routerLink="/recuperar">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="btn btn-primary btn-lg w-100" [disabled]="loading">{{ loading ? 'Ingresando...' : 'Entrar' }}</button>
      <p class="text-danger mt-3" *ngIf="error">{{ error }}</p>
    </form>

    <p class="login-footer">
      ¿No tienes cuenta?
      <a routerLink="/registro">Regístrate</a>
    </p>
  </div>
</section>
